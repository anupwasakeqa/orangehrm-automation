name: OrangeHRM Automation Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Xvfb and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg2 curl

          curl -fsSL https://dl.k6.io/key.gpg             | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main"             | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install -y k6

          k6 version

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 2
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "Virtual display started on :99"

      - name: Prepare video directory
        run: |
          mkdir -p videos

      - name: Start screen recording
        run: |
          ffmpeg \
            -y \
            -video_size 1920x1080 \
            -framerate 15 \
            -f x11grab \
            -i :99.0 \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            videos/orangehrm-test-run.mp4 \
            > /tmp/ffmpeg.log 2>&1 &

          echo $! > /tmp/ffmpeg.pid
          sleep 3
          echo "Screen recording started."

      - name: Run Maven Tests
        run: |
          mvn clean test

      - name: Prepare k6 results directory
        run: |
          mkdir -p performance/k6/results

      - name: Run k6 Performance Test
        run: |
          k6 run --out json=performance/k6/results/k6-results.json performance/k6/login.js

      - name: Stop screen recording
        if: always()
        run: |
          if [ -f /tmp/ffmpeg.pid ]; then
            kill -INT "$(cat /tmp/ffmpeg.pid)" || true
            sleep 3
          fi

          if [ -f /tmp/xvfb.pid ]; then
            kill "$(cat /tmp/xvfb.pid)" || true
          fi

          echo "Screen recording stopped."

          if [ -f videos/orangehrm-test-run.mp4 ]; then
            ls -lh videos/orangehrm-test-run.mp4
          else
            echo "Video file was not generated."
          fi

      - name: Upload Extent HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-extent-report
          path: test-output/ExtentReport.html
          if-no-files-found: warn

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-html-test-reports
          path: |
            test-output/*.html
            test-output/*.xml
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-test-screenshots
          path: |
            test-output/screenshots/
            screenshots/
          if-no-files-found: warn

      - name: Upload Videos
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-test-videos
          path: videos/
          if-no-files-found: warn

      - name: Upload k6 Performance Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-k6-performance-results
          path: performance/k6/results/k6-results.json
          if-no-files-found: warn

      - name: Upload Xvfb and FFmpeg logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-video-recording-logs
          path: |
            /tmp/xvfb.log
            /tmp/ffmpeg.log
          if-no-files-found: warn
