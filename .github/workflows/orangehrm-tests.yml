```yaml
name: OrangeHRM Automation Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-html-test-reports
          path: |
            test-output/*.html
            test-output/*.xml
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-test-screenshots
          path: |
            test-output/screenshots/
            screenshots/
          if-no-files-found: warn

      - name: Upload Videos
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-test-videos
          path: videos/
          if-no-files-found: warn
```
