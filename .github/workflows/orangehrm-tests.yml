name: OrangeHRM Automation Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean test

      - name: Upload Test Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orangehrm-test-reports
          path: test-output/
          if-no-files-found: warn